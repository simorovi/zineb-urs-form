# Controllo dei segreti a ogni push e a ogni pull request (il repo è PUBBLICO).
# Scansiona sia i file così come sono (esattamente ciò che GitHub Pages pubblica) sia tutta la
# cronologia git, con le sole eccezioni dichiarate in .gitleaks.toml. Se trova qualcosa il job
# fallisce (✗ rossa sulla PR) e nei log il valore trovato è oscurato (--redact).
#
# Sicurezza del workflow:
# - SOLO `pull_request`, MAI `pull_request_target`: chiunque può aprire una PR su un repo pubblico, e
#   pull_request_target eseguirebbe il codice della PR con i permessi e i segreti del repo.
# - permessi minimi (contents: read); nessun secret del repo usato. L'unico token è quello automatico
#   di GitHub, in sola lettura, usato da actions/checkout e non salvato (persist-credentials: false).
# - azioni di terze parti fissate a un commit preciso (SHA completo), aggiornate da Dependabot.
# - gitleaks scaricato in $RUNNER_TEMP (fuori dal repo, così `gitleaks dir .` non scansiona il
#   binario) e verificato con lo SHA-256 ufficiale. Versione e SHA-256 vanno tenuti allineati a
#   tools/installa-gitleaks.sh e .githooks/pre-commit (Dependabot non li aggiorna).
name: Controllo segreti

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (file e cronologia)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSIONE: 8.30.1
      # SHA-256 ufficiale di gitleaks_8.30.1_linux_x64.tar.gz (gitleaks_8.30.1_checksums.txt)
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout con tutta la cronologia
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scarica e verifica gitleaks
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          archivio="gitleaks_${GITLEAKS_VERSIONE}_linux_x64.tar.gz"
          curl -sSfL -o "$archivio" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSIONE}/${archivio}"
          echo "${GITLEAKS_SHA256}  ${archivio}" | sha256sum -c -
          mkdir -p gitleaks-bin
          tar -xzf "$archivio" -C gitleaks-bin gitleaks
          mkdir -p nessuna-eccezione
          test "$(gitleaks-bin/gitleaks version)" = "$GITLEAKS_VERSIONE"

      # --ignore-gitleaks-allow e un .gitleaksignore vuoto: valgono SOLO le eccezioni di .gitleaks.toml,
      # non commenti "gitleaks:allow" o file di eccezioni che una PR potrebbe aggiungere.
      - name: Scansione dei file (ciò che Pages pubblica)
        run: |
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" dir . \
            --config .gitleaks.toml --redact --verbose --no-banner \
            --ignore-gitleaks-allow --gitleaks-ignore-path "$RUNNER_TEMP/nessuna-eccezione"

      - name: Scansione di tutta la cronologia git
        if: ${{ !cancelled() }}
        run: |
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git . \
            --config .gitleaks.toml --redact --verbose --no-banner \
            --ignore-gitleaks-allow --gitleaks-ignore-path "$RUNNER_TEMP/nessuna-eccezione" \
            --log-opts="--all"
